name: Release

on:
  push:
    tags: ['v*']

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/immichchrono

jobs:
  image:
    # Native runners per architecture – no QEMU emulation.
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env: { DIGEST: '${{ steps.build.outputs.digest }}' }
      - uses: actions/upload-artifact@v4
        with: { name: 'digest-${{ matrix.arch }}', path: digests/*, retention-days: 1 }

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { pattern: digest-*, merge-multiple: true, path: digests }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Multi-arch manifest
        working-directory: digests
        run: |
          V="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$IMAGE:$V" -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
      - name: GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "ImmichChrono $V" --notes-file notes.md
